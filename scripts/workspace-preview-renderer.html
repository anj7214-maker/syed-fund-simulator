<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FundOps local preview encoder</title>
<style>body{margin:24px;background:#071014;color:#d6e2ea;font:16px system-ui}h1{font-size:24px}button{background:#172a32;color:white;border:1px solid #516a76;padding:12px;cursor:pointer;margin-right:12px}button:disabled{opacity:.5}canvas{display:block;width:min(100%,1280px);height:auto;border:1px solid #263940;margin-top:24px}output{display:block;margin:16px 0;white-space:pre-wrap}p{max-width:80ch}</style>
<h1>FundOps local screen-capture encoder</h1><p>Only approved synthetic screenshots are encoded. No microphone, screen-sharing permission or external service is used.</p>
<button id="hedge-fund">Render Hedge Fund</button><button id="real-estate">Render Real Estate</button><output id="status" aria-live="polite">Ready</output><canvas width="1280" height="720" aria-label="Screen-capture walkthrough"></canvas>
<script type="module">
const canvas = document.querySelector('canvas'), ctx = canvas.getContext('2d'), status = document.querySelector('output');
const scenes = await (await fetch('/scenes')).json();
async function render(asset) {
  const buttons = [...document.querySelectorAll('button')]; buttons.forEach(b => b.disabled = true);
  let stream, recorder;
  try {
    const mime = ['video/webm;codecs=vp9','video/webm;codecs=vp8'].find(t => MediaRecorder.isTypeSupported(t));
    if (!mime) throw new Error('This browser has no supported WebM encoder.');
    const scene = scenes[asset], images = await Promise.all(scene.steps.map(async ([file]) => { const img = new Image(); img.src = '/' + file; await img.decode(); return img; }));
    const duration = scene.seconds * images.length * 1000;
    const tone = meta => meta.tone === 'warning' ? '#efbd59' : meta.tone === 'success' ? '#61d9a3' : '#66d5e4';
    const ease = t => 1 - Math.pow(1 - t, 3);
    function text(value, x, y, size, maxWidth, color = '#f3f8fb', weight = 600, align = 'left') {
      ctx.fillStyle = color; ctx.textAlign = align;
      while (size > 14) { ctx.font = `${weight} ${size}px system-ui`; if (ctx.measureText(value).width <= maxWidth) break; size--; }
      ctx.fillText(value, x, y); ctx.textAlign = 'left';
    }
    function camera(index, progress, opacity) {
      const img = images[index], meta = scene.steps[index][2], crop = meta.crop;
      const zoom = 1.045 - .045 * ease(progress), sw = Math.min(1, crop[2] * zoom), sh = Math.min(1, crop[3] * zoom);
      const sx = Math.max(0, Math.min(1 - sw, crop[0] + (crop[2] - sw) / 2)), sy = Math.max(0, Math.min(1 - sh, crop[1] + (crop[3] - sh) / 2));
      const scale = Math.min(1232 / (sw * img.width), 470 / (sh * img.height));
      const w = sw * img.width * scale, h = sh * img.height * scale, x = (1280 - w) / 2, y = 108 + (470 - h) / 2;
      ctx.save(); ctx.globalAlpha = opacity; ctx.beginPath(); ctx.rect(24,108,1232,470); ctx.clip();
      ctx.drawImage(img,sx*img.width,sy*img.height,sw*img.width,sh*img.height,x,y,w,h);
      if(meta.focus && progress > .12) {
        const [fx,fy,fw,fh] = meta.focus;
        ctx.globalAlpha = opacity * Math.min(1,(progress-.12)*5); ctx.strokeStyle = tone(meta); ctx.lineWidth = 2;
        ctx.strokeRect(x+(fx-sx)*img.width*scale-4,y+(fy-sy)*img.height*scale-4,fw*img.width*scale+8,fh*img.height*scale+8);
      }
      ctx.restore();
    }
    function draw(elapsed) {
      const length = scene.seconds * 1000, index = Math.min(images.length - 1, Math.floor(elapsed / length));
      const progress = Math.min(1,(elapsed - index*length)/length), meta = scene.steps[index][2];
      ctx.fillStyle = '#071014'; ctx.fillRect(0,0,1280,720);
      text('FundOps Lab',24,31,20,240);
      text(scene.title,200,31,18,680,'#c5d7e1',500);
      text('PRERECORDED SANDBOX',1256,31,14,300,'#9fb5c2',500,'right');
      ctx.fillStyle = '#263940'; ctx.fillRect(24,48,1232,1);
      text(scene.steps[index][1],24,87,29,780);
      text(meta.metric,1256,87,32,430,tone(meta),650,'right');
      const transition = index > 0 ? Math.min(1,progress*length/360) : 1;
      if(transition < 1) camera(index-1,1,1);
      camera(index,progress,transition);
      ctx.fillStyle = '#0e191e'; ctx.fillRect(0,594,1280,126);
      text(meta.detail,24,630,22,1232,'#d7e5ed',500);
      text(`${meta.chapter}  /  ${String(index+1).padStart(2,'0')} of ${String(images.length).padStart(2,'0')}`,24,675,18,800,tone(meta),600);
      text('Actual tool screens · Synthetic data',1256,675,16,410,'#9fb5c2',500,'right');
      const gap = 8, segment = (1232 - gap*(images.length-1))/images.length;
      for(let i=0;i<images.length;i++) {
        ctx.fillStyle = '#344b55'; ctx.fillRect(24+i*(segment+gap),699,segment,4);
        if(i<=index) { ctx.fillStyle = tone(scene.steps[i][2]); ctx.fillRect(24+i*(segment+gap),699,segment*(i<index?1:progress),4); }
      }
    }
    draw(0); stream = canvas.captureStream(24); recorder = new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:2000000});
    const chunks = []; recorder.ondataavailable = event => { if (event.data.size) chunks.push(event.data); };
    const stopped = new Promise((resolve,reject) => { recorder.onstop = resolve; recorder.onerror = event => reject(event.error || new Error('Encoding failed')); });
    recorder.start(500); const started = performance.now();
    await new Promise(resolve => { const timer = setInterval(() => { const elapsed = performance.now()-started; draw(elapsed); status.textContent = `Encoding ${asset}: ${Math.min(100,Math.round(elapsed/duration*100))}%`; if(elapsed >= duration) { clearInterval(timer); resolve(); } }, 42); });
    recorder.stop(); await stopped;
    const blob = new Blob(chunks,{type:'video/webm'});
    const response = await fetch('/save/' + asset,{method:'POST',headers:{'Content-Type':'video/webm'},body:blob});
    if (!response.ok) throw new Error(await response.text());
    const result = await response.json(); status.textContent = `Saved ${result.asset}.webm / ${result.seconds}s / ${result.bytes} bytes`;
    document.getElementById(asset).textContent = 'Rendered ' + scene.title;
  } catch(error) { status.textContent = 'Failed: ' + error.message; }
  finally { if(recorder?.state === 'recording') recorder.stop(); stream?.getTracks().forEach(t => t.stop()); buttons.forEach(b => b.disabled = false); }
}
document.querySelectorAll('button').forEach(button => button.addEventListener('click',()=>render(button.id)));
</script></html>
